services:

  # 1. Service web server (PHP + Apache)
  web:
    build:
      context: .
      dockerfile: src/docker/php/Dockerfile
    container_name: parking_app_web
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      # Variables d'environnement pour PHP/Application
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # JSON file storage path
      JSON_DATA_PATH: /var/www/html/data/json/
      # JWT Authentication
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}

  # 2. Service database (PostgreSQL)
  db:
    image: postgres:14-alpine # Utilisation de l'image officielle PostgreSQL
    container_name: parking_app_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432" # Le port standard de PostgreSQL
    volumes:
      # For persisting database data
      - pgdata:/var/lib/postgresql/data
      # SQL initialization script (runs on first startup)
      - ./src/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata: # Définit le volume persistant pour les données PostgreSQL
