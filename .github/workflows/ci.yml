name: CI - deploy on prod

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop, feat-implement-abonnement-module-structure-module ]

jobs:
  php-lint-and-test:
    name: PHP Linting & Testing
    runs-on: ubuntu-latest
    
    # Définition des variables communes pour le job et les services
    env:
      POSTGRES_USER: parking_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: parking_db_test
      MONGO_USER: parking_mongo
      MONGO_PASSWORD: test_password
      MONGO_DB: parking_db_test

    services:
      postgres:
        image: postgres:14-alpine
        env:
          # Utilisation des variables du job
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: ${{ env.MONGO_USER }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ env.MONGO_PASSWORD }}
          MONGO_INITDB_DATABASE: ${{ env.MONGO_DB }}
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, zip, gd, mongodb
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --ignore-platform-req=ext-mongodb

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          # Utilisation directe des variables d'environnement (accessibles par bash)
          timeout 60 bash -c 'until pg_isready -h localhost -p 5432 -U $POSTGRES_USER; do echo "Waiting..."; sleep 2; done'
          echo "✅ PostgreSQL is ready!"

      - name: Apply database schema (init + migrations)
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: |
          echo "Applying init.sql"
          psql -h localhost -U $POSTGRES_USER -d $POSTGRES_DB -f src/docker/postgres/init.sql

          echo "Applying all migrations"
          for f in src/docker/postgres/migrations/*.sql; do
            echo " → $f"
            psql -h localhost -U $POSTGRES_USER -d $POSTGRES_DB -f "$f"
          done

      - name: Regenerate autoload
        run: composer dump-autoload --optimize --no-interaction

      - name: Check PHP syntax errors
        run: find src -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Run PHPUnit tests
        env:
          DB_HOST: localhost
          DB_NAME: ${{ env.POSTGRES_DB }}
          DB_USER: ${{ env.POSTGRES_USER }}
          DB_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          MONGO_HOST: localhost
          MONGO_DB: ${{ env.MONGO_DB }}
          MONGO_USER: ${{ env.MONGO_USER }}
          MONGO_PASSWORD: ${{ env.MONGO_PASSWORD }}
          JWT_SECRET_KEY: test-jwt-secret-key-for-ci-cd
        run: |
          if [ -f "vendor/bin/phpunit" ]; then
            vendor/bin/phpunit --testdox
          else
            echo "PHPUnit not configured yet, skipping tests"
          fi

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Create .env file for testing
        run: |
          cat > .env << EOF
          POSTGRES_USER=parking_user
          POSTGRES_PASSWORD=test_password
          POSTGRES_DB=parking_db_test
          DB_HOST=db
          DB_NAME=parking_db_test
          DB_USER=parking_user
          DB_PASSWORD=test_password
          MONGO_USER=parking_mongo
          MONGO_PASSWORD=test_password
          MONGO_DB=parking_db_test
          JWT_SECRET_KEY=test-jwt-secret-key-for-ci-cd
          EOF
          echo "✅ .env file created:"
          cat .env
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, zip, gd, mongodb
          tools: composer:v2
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --ignore-platform-req=ext-mongodb
      - name: Debug - List vendor directory
        run: |
          echo "Listing root directory:"
          ls -la
          echo "Listing vendor directory:"
          ls -la vendor
      - name: Build Docker images
        run: docker compose build --no-cache
      - name: Start Docker containers
        run: |
          echo "Starting Docker containers..."
          docker compose up -d
          echo "Waiting 5 seconds for containers to initialize..."
          sleep 5
          docker compose ps
      # ... reste des étapes inchangées ...
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, zip, gd, mongodb
          coverage: none
          tools: composer:v2, phpstan, php-cs-fixer
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --ignore-platform-req=ext-mongodb
      - name: Check code style (PSR-12)
        run: |
          if [ -f ".php-cs-fixer.php" ]; then
            php-cs-fixer fix --dry-run --diff --verbose
          else
            echo "PHP-CS-Fixer config not found, skipping"
          fi
        continue-on-error: true
      - name: Run PHPStan static analysis
        run: |
          if [ -f "phpstan.neon" ]; then
            phpstan analyse src --level=5
          else
            echo "PHPStan config not found, skipping"
          fi
        continue-on-error: true

  security-check:
    name: Security Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Check for security vulnerabilities
        run: composer audit
        continue-on-error: true
