name: CI - deploy on prod 

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  php-lint-and-test:
    name: PHP Linting & Testing
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: parking_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: parking_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: parking_mongo
          MONGO_INITDB_ROOT_PASSWORD: test_password
          MONGO_INITDB_DATABASE: parking_db_test
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, zip, gd, mongodb
          coverage: none
          tools: composer:v2

      - name: Verify PHP extensions
        run: |
          echo "Installed PHP extensions:"
          php -m | grep -E '(pdo|pgsql|mongodb|zip|gd)'
          echo "MongoDB extension loaded successfully!"

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --ignore-platform-req=ext-mongodb

      - name: Force regenerate autoload files (fix case sensitivity)
        run: |
          # Supprimer l'ancien autoloader pour forcer la régénération
          rm -f vendor/composer/autoload*.php
          rm -rf vendor/composer/autoload_classmap.php vendor/composer/autoload_namespaces.php vendor/composer/autoload_psr4.php vendor/composer/autoload_static.php 2>/dev/null || true
          # S'assurer que les fichiers de tests existent
          echo "Checking test files exist:"
          find tests -name "*.php" -type f | head -5
          # Régénérer l'autoloader avec la structure actuelle (incluant autoload-dev)
          composer dump-autoload --optimize --no-interaction
          echo "✅ Autoloader regenerated with current file structure"
          # Vérifier que les fichiers de tests sont dans l'autoloader
          echo "Checking autoloader includes test files:"
          if [ -f "vendor/composer/autoload_psr4.php" ]; then
            grep -A 1 "Tests" vendor/composer/autoload_psr4.php || echo "Tests namespace not found"
          fi

      - name: Check PHP syntax errors
        run: find src -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          timeout 60 bash -c 'until pg_isready -h localhost -p 5432 -U parking_user; do echo "Waiting..."; sleep 2; done'
          echo "✅ PostgreSQL is ready!"

      - name: Create users table (run migration)
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: parking_db_test
          PGUSER: parking_user
          PGPASSWORD: test_password
        run: |
          echo "Creating users table..."
          export PGPASSWORD="$PGPASSWORD"
          
          # Exécuter la migration
          if psql -h localhost -U parking_user -d parking_db_test -f src/docker/postgres/migrations/001_create_users_table.sql; then
            echo "✅ Migration executed successfully!"
          else
            echo "❌ Migration failed!"
            exit 1
          fi
          
          # Vérifier que la table existe
          echo "Verifying table exists..."
          if psql -h localhost -U parking_user -d parking_db_test -c "\d users" > /dev/null 2>&1; then
            echo "✅ Users table verified!"
          else
            echo "❌ Users table verification failed!"
            echo "Checking if table exists..."
            psql -h localhost -U parking_user -d parking_db_test -c "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'users';"
            exit 1
          fi

      - name: Regenerate autoload after migration (ensure all classes are loaded)
        run: |
          composer dump-autoload --optimize --no-interaction
          echo "✅ Autoloader regenerated after database migration"
          # Vérifier que les classes critiques sont chargées
          php -r "require 'vendor/autoload.php'; echo 'GetUserUseCase: ' . (class_exists('App\Application\UseCases\User\GetUserUseCase') ? 'OK' : 'MISSING') . PHP_EOL; echo 'UserApiFunctionalTestHelper: ' . (class_exists('Tests\Functional\User\UserApiFunctionalTestHelper') ? 'OK' : 'MISSING') . PHP_EOL;"

      - name: Verify critical files and classes before tests
        run: |
          echo "=== Verifying file structure ==="
          echo "Checking if test files exist:"
          ls -la tests/functional/User/ || echo "Directory tests/functional/User/ not found!"
          echo ""
          echo "Checking for UserApiFunctionalTestHelper.php:"
          find tests -name "UserApiFunctionalTestHelper.php" -type f || echo "File not found in tests/"
          echo ""
          echo "Checking UseCases directory:"
          ls -la src/Application/UseCases/User/ || echo "Directory not found!"
          echo ""
          
          echo "=== Verifying autoloader configuration ==="
          if [ -f "vendor/composer/autoload_psr4.php" ]; then
            echo "Autoloader file exists"
            grep -A 1 "Tests" vendor/composer/autoload_psr4.php || echo "Tests namespace not found in autoloader"
          else
            echo "ERROR: Autoloader file missing!"
          fi
          echo ""
          
          echo "=== Verifying classes are loadable ==="
          php -r "
          require 'vendor/autoload.php';
          
          // Charger manuellement UserApiFunctionalTestHelper si nécessaire
          \$helperFile = __DIR__ . '/tests/functional/User/UserApiFunctionalTestHelper.php';
          if (file_exists(\$helperFile) && !class_exists('Tests\Functional\User\UserApiFunctionalTestHelper')) {
            require_once \$helperFile;
          }
          
          \$fileChecks = [
            'tests/functional/User/UserApiFunctionalTestHelper.php' => 'UserApiFunctionalTestHelper file',
            'src/Application/UseCases/User/GetUserUseCase.php' => 'GetUserUseCase file',
            'src/Application/UseCases/User/ListUsersUseCase.php' => 'ListUsersUseCase file',
            'src/Application/UseCases/User/UpdateUserUseCase.php' => 'UpdateUserUseCase file',
            'src/Presenter/Http/Controllers/Api/AuthController.php' => 'AuthController file',
            'src/Presenter/Http/Controllers/Api/UserController.php' => 'UserController file'
          ];
          
          \$classChecks = [
            'App\Application\UseCases\User\GetUserUseCase' => 'GetUserUseCase class',
            'App\Application\UseCases\User\ListUsersUseCase' => 'ListUsersUseCase class',
            'App\Application\UseCases\User\UpdateUserUseCase' => 'UpdateUserUseCase class',
            'App\Presenter\Http\Controllers\Api\AuthController' => 'AuthController class',
            'App\Presenter\Http\Controllers\Api\UserController' => 'UserController class',
            'Tests\Functional\User\UserApiFunctionalTestHelper' => 'UserApiFunctionalTestHelper class'
          ];
          
          \$allOk = true;
          
          echo \"Checking files exist:\" . PHP_EOL;
          foreach (\$fileChecks as \$file => \$desc) {
            if (file_exists(\$file)) {
              echo \"  ✅ \$desc: exists\" . PHP_EOL;
            } else {
              echo \"  ❌ \$desc: MISSING at \$file\" . PHP_EOL;
              \$allOk = false;
            }
          }
          
          echo PHP_EOL . \"Checking classes are loadable:\" . PHP_EOL;
          foreach (\$classChecks as \$class => \$desc) {
            if (class_exists(\$class)) {
              echo \"  ✅ \$desc: loaded\" . PHP_EOL;
            } else {
              echo \"  ❌ \$desc: NOT FOUND\" . PHP_EOL;
              // Pour UserApiFunctionalTestHelper, essayer de charger manuellement
              if (\$class === 'Tests\Functional\User\UserApiFunctionalTestHelper') {
                \$filePath = __DIR__ . '/tests/functional/User/UserApiFunctionalTestHelper.php';
                if (file_exists(\$filePath)) {
                  echo \"    → Attempting manual require: \$filePath\" . PHP_EOL;
                  require_once \$filePath;
                  if (class_exists(\$class)) {
                    echo \"    ✅ Successfully loaded manually!\" . PHP_EOL;
                    continue; // Skip the error flag
                  } else {
                    echo \"    ❌ Still not found after manual require\" . PHP_EOL;
                  }
                } else {
                  echo \"    ❌ File does not exist at: \$filePath\" . PHP_EOL;
                }
              }
              \$allOk = false;
            }
          }
          
          if (!\$allOk) {
            echo PHP_EOL . \"ERROR: Some critical files or classes are missing!\" . PHP_EOL;
            echo \"Attempting to regenerate autoloader...\" . PHP_EOL;
            
            // Forcer la régénération complète de l'autoloader
            system('rm -f vendor/composer/autoload*.php');
            system('composer dump-autoload --optimize --no-interaction');
            
            // Essayer de charger manuellement le fichier si nécessaire
            \$helperFile = __DIR__ . '/tests/functional/User/UserApiFunctionalTestHelper.php';
            if (file_exists(\$helperFile)) {
              echo \"Attempting to manually require helper file...\" . PHP_EOL;
              require_once \$helperFile;
            }
            
            // Recharger l'autoloader
            require 'vendor/autoload.php';
            
            echo PHP_EOL . \"Re-checking classes after regeneration:\" . PHP_EOL;
            foreach (\$classChecks as \$class => \$desc) {
              if (class_exists(\$class)) {
                echo \"  ✅ \$desc: NOW LOADED\" . PHP_EOL;
              } else {
                echo \"  ❌ \$desc: STILL NOT FOUND\" . PHP_EOL;
                // Pour UserApiFunctionalTestHelper, essayer de charger manuellement
                if (\$class === 'Tests\Functional\User\UserApiFunctionalTestHelper') {
                  \$filePath = __DIR__ . '/tests/functional/User/UserApiFunctionalTestHelper.php';
                  if (file_exists(\$filePath)) {
                    echo \"    Attempting manual require: \$filePath\" . PHP_EOL;
                    try {
                      require_once \$filePath;
                      if (class_exists(\$class)) {
                        echo \"    ✅ Successfully loaded manually!\" . PHP_EOL;
                      } else {
                        echo \"    ❌ Still not found after manual require\" . PHP_EOL;
                      }
                    } catch (Exception \$e) {
                      echo \"    ❌ Error loading: \" . \$e->getMessage() . PHP_EOL;
                    }
                  } else {
                    echo \"    ❌ File does not exist at: \$filePath\" . PHP_EOL;
                  }
                }
              }
            }
            
            // Vérifier une dernière fois si tout est OK
            \$finalCheck = true;
            foreach (\$classChecks as \$class => \$desc) {
              if (!class_exists(\$class)) {
                \$finalCheck = false;
              }
            }
            
            if (!\$finalCheck) {
              exit(1);
            }
          }
          
          echo PHP_EOL . \"✅ All critical files and classes are available\" . PHP_EOL;
          "

      - name: Run PHPUnit tests
        env:
          DB_HOST: localhost
          DB_NAME: parking_db_test
          DB_USER: parking_user
          DB_PASSWORD: test_password
          DB_PORT: 5432
          JWT_SECRET_KEY: test-jwt-secret-key-for-ci-cd
          MONGO_HOST: localhost
          MONGO_DB: parking_db_test
          MONGO_USER: parking_mongo
          MONGO_PASSWORD: test_password
        run: |
          if [ -f "vendor/bin/phpunit" ]; then
            vendor/bin/phpunit --testdox
          else
            echo "PHPUnit not configured yet, skipping tests"
          fi

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file for testing
        run: |
          cat > .env << EOF
          POSTGRES_USER=parking_user
          POSTGRES_PASSWORD=test_password
          POSTGRES_DB=parking_db_test
          DB_HOST=db
          DB_NAME=parking_db_test
          DB_USER=parking_user
          DB_PASSWORD=test_password
          MONGO_USER=parking_mongo
          MONGO_PASSWORD=test_password
          MONGO_DB=parking_db_test
          EOF

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, zip, gd, mongodb
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --ignore-platform-req=ext-mongodb

      - name: Debug - List vendor directory
        run: |
          echo "Listing root directory:"
          ls -la
          echo "Listing vendor directory:"
          ls -la vendor


      - name: Build Docker images
        run: docker compose build --no-cache

      - name: Start Docker containers
        run: docker compose up -d

      - name: Wait for containers to be running
        run: |
          echo "Waiting for containers to start..."
          max_attempts=60
          attempt=0
          containers_up=false
          
          while [ $attempt -lt $max_attempts ]; do
            # Vérifier que tous les conteneurs sont en cours d'exécution
            if docker compose ps | grep -qE "(parking_app_web|parking_app_db|parking_app_mongodb).*Up"; then
              containers_up=true
              echo "✅ Containers are starting up"
              break
            fi
            echo "Waiting for containers... (attempt $((attempt+1))/$max_attempts)"
            sleep 2
            attempt=$((attempt+1))
          done
          
          if [ "$containers_up" != "true" ]; then
            echo "❌ Containers did not start within timeout!"
            echo "Container status:"
            docker compose ps
            echo "Container logs:"
            docker compose logs
            exit 1
          fi
          
          echo "Checking container status:"
          docker compose ps
          
          # Vérifier que le conteneur db existe et est en cours d'exécution
          if ! docker compose ps | grep -q "parking_app_db.*Up"; then
            echo "❌ Container 'db' is not running!"
            echo "Container logs:"
            docker compose logs db || echo "Cannot get logs for db"
            docker compose ps
            exit 1
          fi
          
          echo "✅ All containers are running!"
          
          # Attendre un peu pour que les services démarrent complètement
          echo "Waiting 10 seconds for services to initialize..."
          sleep 10

      - name: Debug - Check container files
        run: |
          echo "Checking /var/www/html in container:"
          docker compose exec -T web ls -la /var/www/html || echo "Cannot access web container"
          echo "Checking vendor in container:"
          docker compose exec -T web ls -la /var/www/html/vendor || echo "Vendor not found in container"

      - name: Wait for services to be ready
        run: |
          echo "=== Waiting for PostgreSQL ==="
          max_attempts=90
          attempt=0
          postgres_ready=false
          
          while [ $attempt -lt $max_attempts ]; do
            # Vérifier si le conteneur est en cours d'exécution
            if ! docker compose ps db 2>/dev/null | grep -q "Up"; then
              echo "⚠️ Container 'db' is not running! (attempt $((attempt+1))/$max_attempts)"
              docker compose ps db 2>/dev/null || echo "Cannot check container status"
              sleep 3
              attempt=$((attempt+1))
              continue
            fi
            
            # Vérifier si PostgreSQL est prêt (essayer pg_isready dans le conteneur)
            if docker compose exec -T db sh -c "pg_isready -U parking_user" 2>/dev/null | grep -q "accepting connections"; then
              echo "✅ PostgreSQL is ready!"
              postgres_ready=true
              break
            fi
            
            # Si pg_isready n'est pas disponible, vérifier que le conteneur répond
            if docker compose exec -T db sh -c "psql -U parking_user -d parking_db_test -c 'SELECT 1'" 2>/dev/null | grep -q "1"; then
              echo "✅ PostgreSQL is ready (verified via psql)!"
              postgres_ready=true
              break
            fi
            
            echo "Waiting for PostgreSQL... (attempt $((attempt+1))/$max_attempts)"
            sleep 3
            attempt=$((attempt+1))
          done
          
          if [ "$postgres_ready" != "true" ]; then
            echo "❌ PostgreSQL did not become ready within timeout!"
            echo "PostgreSQL logs:"
            docker compose logs db | tail -50
            echo ""
            echo "Container status:"
            docker compose ps db
            echo ""
            echo "Trying to connect manually:"
            docker compose exec -T db pg_isready -U parking_user || echo "pg_isready failed"
            docker compose exec -T db psql -U parking_user -l || echo "psql -l failed"
            exit 1
          fi
          
          # Vérification supplémentaire
          echo "Verifying PostgreSQL connection..."
          if docker compose exec -T db sh -c "pg_isready -U parking_user" 2>/dev/null | grep -q "accepting connections"; then
            echo "✅ PostgreSQL connection verified!"
          else
            echo "⚠️ pg_isready check failed, but continuing..."
          fi
          
          echo ""
          echo "=== Waiting for MongoDB ==="
          max_attempts=60
          attempt=0
          mongo_ready=false
          
          while [ $attempt -lt $max_attempts ]; do
            # Vérifier si le conteneur est en cours d'exécution
            if ! docker compose ps mongodb | grep -q "Up"; then
              echo "⚠️ Container 'mongodb' is not running! (attempt $((attempt+1))/$max_attempts)"
              docker compose ps mongodb
              sleep 3
              attempt=$((attempt+1))
              continue
            fi
            
            # Vérifier si MongoDB est prêt
            if docker compose exec -T mongodb mongosh --eval "db.runCommand({ ping: 1 })" --quiet 2>/dev/null | grep -q "ok"; then
              echo "✅ MongoDB is ready!"
              mongo_ready=true
              break
            fi
            
            echo "Waiting for MongoDB... (attempt $((attempt+1))/$max_attempts)"
            sleep 3
            attempt=$((attempt+1))
          done
          
          if [ "$mongo_ready" != "true" ]; then
            echo "❌ MongoDB did not become ready within timeout!"
            echo "MongoDB logs:"
            docker compose logs mongodb | tail -50
            echo "Container status:"
            docker compose ps mongodb
            exit 1
          fi
          
          echo ""
          echo "Waiting for web server to initialize..."
          sleep 10
          echo "✅ All services should be ready!"

      - name: Check container health
        run: |
          docker compose ps
          docker compose logs web
          docker compose logs db
          docker compose logs mongodb

      - name: Test health endpoint
        run: |
          echo "Testing health endpoint..."
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/health)
          echo "Health endpoint returned: $response"
          if [ "$response" != "200" ]; then
            echo "❌ Health check failed with status: $response"
            echo "Web server logs:"
            docker compose logs web
            exit 1
          fi
          echo "✅ Health check passed!"

      - name: Test PostgreSQL connection
        run: |
          echo "Testing PostgreSQL connection..."
          echo "Fetching response from /db-test..."
          response=$(curl -s http://localhost/db-test)
          echo "=========================================="
          echo "Full Response:"
          echo "$response"
          echo "=========================================="
          
          # Check if response contains success status
          if echo "$response" | grep -qi 'success'; then
            echo "✅ PostgreSQL connection test passed!"
          else
            echo "❌ PostgreSQL connection test failed!"
            echo "Expected JSON with 'success' status, but got different response"
            echo ""
            echo "Database logs:"
            docker compose logs db | tail -50
            echo ""
            echo "Web logs:"
            docker compose logs web | tail -50
            exit 1
          fi

      - name: Test MongoDB connection
        run: |
          echo "Testing MongoDB connection..."
          echo "Fetching response from /mongo-test..."
          response=$(curl -s http://localhost/mongo-test)
          echo "=========================================="
          echo "Full Response:"
          echo "$response"
          echo "=========================================="
          
          # Check if response contains success status
          if echo "$response" | grep -qi 'success'; then
            echo "✅ MongoDB connection test passed!"
          else
            echo "❌ MongoDB connection test failed!"
            echo "Expected JSON with 'success' status, but got different response"
            echo ""
            echo "MongoDB logs:"
            docker compose logs mongodb | tail -50
            echo ""
            echo "Web logs:"
            docker compose logs web | tail -50
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: docker compose down -v

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, zip, gd, mongodb
          coverage: none
          tools: composer:v2, phpstan, php-cs-fixer

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --ignore-platform-req=ext-mongodb

      - name: Check code style (PSR-12)
        run: |
          if [ -f ".php-cs-fixer.php" ]; then
            php-cs-fixer fix --dry-run --diff --verbose
          else
            echo "PHP-CS-Fixer config not found, skipping"
          fi
        continue-on-error: true

      - name: Run PHPStan static analysis
        run: |
          if [ -f "phpstan.neon" ]; then
            phpstan analyse src --level=5
          else
            echo "PHPStan config not found, skipping"
          fi
        continue-on-error: true

  security-check:
    name: Security Vulnerability Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Check for security vulnerabilities
        run: composer audit
        continue-on-error: true
